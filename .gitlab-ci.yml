stages:
  - validate
  - build
  - publish

variables:
  GIT_DEPTH: "0" # tools/version.sh needs tags
  DOCKER_DRIVER: overlay2

default:
  interruptible: true

.toolchain: &toolchain
  image: golang:1.27-bookworm
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs make git
    - node --version && npm --version && git --version

validate:
  <<: *toolchain
  stage: validate
  script:
    - make lint
    - make test
    - make test-integration
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  <<: *toolchain
  stage: build
  script:
    - make build
  artifacts:
    name: converge-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

docker-build:
  stage: build
  image: docker:28-cli
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache make git bash
  script:
    - make docker-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

publish:
  stage: publish
  image: docker:28-cli
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    MAINLINE: "1"
  before_script:
    - apk add --no-cache make git bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - make docker-build
    - make docker-push
  dependencies:
    - build
  artifacts:
    name: converge-$CI_COMMIT_REF_SLUG
    paths:
      - dist/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
